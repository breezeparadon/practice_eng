# Local development only. Production is a static-friendly Next.js build on Vercel (no database).
# Port chosen to avoid other local projects (3000/3001/3300/3456/3520/8xxx are taken).
name: wordbook

services:
  app:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    ports:
      # Override with: WORDBOOK_PORT=4000 docker compose up -d
      - "${WORDBOOK_PORT:-3640}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules # keep Linux binaries out of the macOS host folder
      - next_cache:/app/.next
    environment:
      WATCHPACK_POLLING: "true" # hot reload on macOS bind mounts
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"

volumes:
  node_modules:
  next_cache:
